server:
  port: 8081

spring:
  application:
    name: smart-recruit-system

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_recruit_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      pool-name: SmartRecruitHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ================================================================
  # Redis — 验证码、缓存、分布式会话
  # ================================================================
  data:
    redis:
      host: 117.72.88.11
      port: 6379
      password: susan123
      database: 4
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5

  # ================================================================
  # Mail — 邮件发送（参考 enterprise-knowledge-base 项目配置）
  # ================================================================
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:12lisu@163.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false
          connection-timeout: 10000
          timeout: 10000
          write-timeout: 10000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smartrecruit.system.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT Configuration — must match gateway's smart-recruit.jwt.secret-key
jwt:
  secret: ${JWT_SECRET_KEY:c21hcnQtcmVjcnVpdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy0yNTY=}

# ================================================================
# RustFS — S3 兼容对象存储（头像、文件上传）
# ================================================================
file:
  storage:
    type: rustfs
    rustfs:
      endpoint: 117.72.88.11
      port: 9091
      access-key: IPL4GZeFumv8g9ANj3b7
      secret-key: IFil9yzO520VLE8f7qoXHgBNkUG4TmWvDrSc1ReQ
      secure: false
      bucket-name: smart-recruit-dev
      connect-timeout: 30000
      read-timeout: 60000
      write-timeout: 60000

# Logging
logging:
  level:
    com.smartrecruit.system: debug
    com.smartrecruit.system.repository: debug
    org.springframework.security: info
