# ============================================================================
# SmartRecruit Common Module - Default Configuration Template
# ============================================================================
# This file provides sensible defaults. Each service module overrides
# specific values in its own application.yml.
# ============================================================================

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ---------------------------------------------------------------------------
# Spring
# ---------------------------------------------------------------------------
spring:
  application:
    name: smart-recruit

  # Datasource (HikariCP)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smart_recruit}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: SmartRecruitHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # Jackson (overridden by JacksonConfig)
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ---------------------------------------------------------------------------
# MyBatis-Plus
# ---------------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.smartrecruit.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: NOT_NULL
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.smartrecruit: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ---------------------------------------------------------------------------
# Knife4j (Swagger)
# ---------------------------------------------------------------------------
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: SmartRecruit API

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**

# ---------------------------------------------------------------------------
# SmartRecruit Custom Config
# ---------------------------------------------------------------------------
smart-recruit:
  cors:
    enabled: true
  snowflake:
    worker-id: 1
    datacenter-id: 1
  security:
    jwt:
      secret: ${JWT_SECRET:smart-recruit-default-secret-key-change-in-production}
      expiration: 86400000  # 24 hours
      refresh-expiration: 604800000  # 7 days
